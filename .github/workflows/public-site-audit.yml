name: Public site source audit

'on':
  pull_request:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out review source
        # Official actions/checkout v4.2.2, immutable reviewed release commit.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify checker detects defects
        run: python3 -m unittest discover -s tests -p test_public_site_audit.py -v
      - name: Audit the actual checkout
        run: python3 scripts/audit_public_site.py .
      - name: Verify extracted mobile menu source and behavior
        run: |
          python3 -m unittest discover -s tests -p test_mobile_menu_extraction.py -v
          node tests/mobile-menu.test.cjs
      - name: Verify contact confirmation recovery and private analytics
        run: |
          node --test tests/contact-form.test.cjs tests/contact-api.test.cjs
          node tests/analytics.test.cjs
          node --test tests/measurement-contract.test.cjs
          node --test tests/contact-browser-contract.test.cjs tests/contact-browser-publication.test.cjs tests/capture-readiness.test.cjs tests/partner-capture-diagnostics.test.cjs
      - name: Verify inline-style migration contract
        run: |
          python3 -m unittest discover -s tests -p test_inline_style_migration.py -v
          python3 -m unittest discover -s tests -p test_csp_phase3_style_blocks.py -v
          python3 -m unittest discover -s tests -p test_csp_phase4_style_blocks.py -v
          python3 -m unittest discover -s tests -p test_csp_phase5_style_block.py -v
          python3 -m unittest discover -s tests -p test_csp_phase6_services_style_block.py -v
      - name: Verify accessibility landmarks and skip navigation
        run: python3 -m unittest discover -s tests -p test_accessibility_landmarks.py -v
      - name: Verify public image intrinsic dimensions
        run: python3 -m unittest discover -s tests -p test_image_dimensions.py -v
      - name: Verify public image loading priorities
        run: python3 -m unittest discover -s tests -p test_image_loading_priority.py -v
      - name: Verify public font loading topology
        run: python3 -m unittest discover -s tests -p test_font_loading.py -v
      - name: Verify live checker detects deployment defects
        run: python3 -m unittest discover -s tests -p test_audit_live_site.py -v
      - name: Verify proposed deployment hardening
        run: python3 -m unittest discover -s tests -p test_vercel_security_headers.py -v
      - name: Verify CSP inventory detects unsafe dependency drift
        run: python3 -m unittest discover -s tests -p test_inventory_csp.py -v
      - name: Inventory active-content dependencies
        run: python3 scripts/inventory_csp.py .
      - name: Audit the live canonical deployment (read-only)
        run: python3 scripts/audit_live_site.py
      - name: Verify literal approved-main baseline guards
        run: python3 -m unittest discover -s tests -p test_immutable_site_baseline.py -v
      - name: Check out immutable approved main for object inventory only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 86894c29c5d02baad35b3cc47815d2d0ec06315e
          path: .pp-approved-main
          fetch-depth: 1
          persist-credentials: false
      - name: Verify literal approved-main bytes and provenance without publication
        run: python3 scripts/immutable_site_baseline.py --repository .pp-approved-main
      - name: Verify approved-content preservation guards
        run: python3 -m unittest discover -s tests -p test_verify_main_content.py -v
      - name: Compare approved main copy metadata and image references without publication
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/verify_main_content.py --baseline-repository .pp-approved-main --candidate .
      - name: Verify immutable-main snapshot bridge guards
        run: |
          python3 -m unittest discover -s tests -p test_export_main_snapshot.py -v
          node --test tests/main-snapshot-contract.test.cjs
      - name: Verify literal approved-main bytes across the Python Node bridge
        run: |
          set -o pipefail
          python3 scripts/export_main_snapshot.py --repository .pp-approved-main | node tests/main-snapshot-contract.cjs
      - name: Verify authenticated candidate snapshot guards
        run: python3 -m unittest discover -s tests -p test_candidate_site_snapshot.py -v
      - name: Check out exact candidate for authenticated public-byte inventory only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .pp-candidate-head
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact candidate commit tree chain and public bytes
        env:
          CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/candidate_site_snapshot.py --repository .pp-candidate-head --commit "$CANDIDATE_COMMIT"
      - name: Verify bounded candidate envelope and literal-main adapter guards
        run: |
          python3 -m unittest discover -s tests -p test_export_candidate_snapshot.py -v
          python3 -m unittest discover -s tests -p test_services_design_preservation.py -v
          node --test tests/candidate-snapshot-contract.test.cjs tests/snapshot-request-handler.test.cjs tests/main-parity-policy.test.cjs
          node --check tests/browser-main-parity.cjs
      - name: Verify actual candidate public bytes across the Python Node bridge
        env:
          CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          python3 scripts/export_candidate_snapshot.py --repository .pp-candidate-head --commit "$CANDIDATE_COMMIT" | node tests/candidate-snapshot-contract.cjs --commit "$CANDIDATE_COMMIT"


  browser-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out protected candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned browser tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify local keyboard and style parity without publication
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/browser-evidence
        run: node tests/browser-publication-gates.cjs
      - name: Preserve browser comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: practice-perfect-browser-gates
          path: ${{ runner.temp }}/browser-evidence

  font-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact protected candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned browser tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify actual reviewed Google Fonts readiness
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          FONT_EVIDENCE_DIR: ${{ runner.temp }}/font-evidence
        run: node tests/browser-font-readiness.cjs
      - name: Check out immutable approved main for literal public rendering
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 86894c29c5d02baad35b3cc47815d2d0ec06315e
          path: .pp-approved-main
          fetch-depth: 1
          persist-credentials: false
      - name: Compare literal approved main with exact candidate public bytes
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          FONT_EVIDENCE_DIR: ${{ runner.temp }}/font-evidence
        run: node tests/browser-main-parity.cjs
      - name: Preserve font readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: practice-perfect-font-readiness
          path: ${{ runner.temp }}/font-evidence

  font-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact protected candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned browser tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify actual-font migrated-style target parity
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          FONT_PARITY_EVIDENCE_DIR: ${{ runner.temp }}/font-parity-evidence
        run: node tests/browser-font-parity.cjs
      - name: Preserve actual-font target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: practice-perfect-font-parity
          path: ${{ runner.temp }}/font-parity-evidence
